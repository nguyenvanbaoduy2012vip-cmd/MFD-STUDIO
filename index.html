/* V4.2 stable mode: anonymous auth + Supabase Realtime, no RPC dependency */
async function auth(){
 if(!SB)throw Error("Supabase chưa tải");
 // Realtime Broadcast public channel không cần Anonymous Auth.
 // Dùng một ID cục bộ cho phiên này để tránh phụ thuộc Provider Anonymous.
 if(!S.id)S.id=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());

 if(!d)return;
 if(d.room)S.room={...S.room,...d.room};

 S.me=S.players.get(S.id)||S.me;S.host=S.room?.host===S.id;
}
function state(){return{room:S.room,settings:S.settings,round:S.round,phase:S.phase,players:[...S.players.values()].map(pack)}}
function broadcastState(){send({type:"state",data:state()})}
async function net(){
 try{await S.channel?.unsubscribe()}catch{}
 S.channel=SB.channel("td_room_"+S.room.code,{config:{broadcast:{self:true},presence:{key:S.id}}});
 S.channel.on("broadcast",{event:"msg"},({payload})=>onNet(payload));
 await new Promise((resolve,reject)=>{
   S.channel.subscribe(st=>{S.online=st==="SUBSCRIBED";if(S.online)resolve();else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")reject(Error("Không kết nối được Realtime"))});
 });
 if(S.host)broadcastState();
}
function onNet(p){
 if(!p||p.sender===S.id)return;
 if((p.type==="hello"||p.type==="request_state")&&S.host){broadcastState();return}
 if(p.type==="state"){applyState(p.data);S.phase==="lobby"?renderLobby():S.phase==="playing"&&render();return}
 if(p.type==="move"&&S.players.has(p.id)){Object.assign(S.players.get(p.id),{x:p.x,y:p.y,dir:p.dir});return}
 if(p.type==="ready"&&S.players.has(p.id)){S.players.get(p.id).ready=p.ready;renderLobby();return}
 if(p.type==="start"){applyState(p.data);S.phase="playing";S.me.role=p.roles?.[S.id]||S.me.role;gameStart();return}
 if(p.type==="role"&&p.target===S.id){S.me.role=p.role;roleReveal();return}
 if(p.type==="kill"){let q=S.players.get(p.id);if(q){q.alive=false;q.ghost=true;q.deadBody=true;q.deadX=p.x;q.deadY=p.y}checkWin();return}
 if(p.type==="task"&&S.players.has(p.id)){S.players.get(p.id).task=p.task;checkWin();return}
 if(p.type==="meeting"){openMeeting(p.reason||"Cuộc họp");return}
 if(p.type==="vote"){applyVote(p.voter,p.target);return}
 if(p.type==="leave"){S.players.delete(p.id);renderLobby()}
 if(p.type==="result")result(p.title,p.desc)
}
async function createRoom(){
 try{
  await auth();const name=safe($("nameCreate").value);if(!name)return toast("Nhập tên.");
  const max=+$("maxP").value,k=+$("killers").value,b=+$("bots").value;if(b+1>max)return toast("Số bot vượt quá số người.");
  S.name=name;S.room={code:code(),password:$("passCreate").value||"",host:S.id,status:"lobby"};S.host=true;
  S.settings={maxPlayers:max,killers:k,bots:b,difficulty:$("difficulty").value,rounds:+$("rounds").value,hideDead:$("hideDead").value==="true"};
  S.players.clear();S.me={id:S.id,name,is_bot:false,is_host:true,ready:true,alive:true,ghost:false,x:450,y:350,task:0,kills:0,lastKill:0,color:"#65ddff",role:null};S.players.set(S.id,S.me);
  for(let i=0;i<b;i++){let q={id:crypto.randomUUID(),name:"BOT_"+(i+1),is_bot:true,is_host:false,ready:true,alive:true,ghost:false,x:400+Math.random()*100,y:320+Math.random()*60,task:0,kills:0,lastKill:0,color:"#ffd45d",role:null};S.players.set(q.id,q)}
  await net();show("lobby");renderLobby();broadcastState();toast("Phòng "+S.room.code+" đã tạo");
 }catch(e){toast(e.message||"Không tạo được phòng")}
}
async function joinRoom(){
 try{
  await auth();const name=safe($("nameJoin").value),c=$("codeJoin").value.trim().toUpperCase();
  if(!name||c.length!==6)return toast("Tên hoặc mã phòng không hợp lệ.");
  S.name=name;S.room={code:c,host:null,password:$("passJoin").value||"",status:"lobby"};S.host=false;S.players.clear();
  S.me={id:S.id,name,is_bot:false,is_host:false,ready:false,alive:true,ghost:false,x:450,y:350,task:0,kills:0,lastKill:0,color:"#65ddff",role:null};S.players.set(S.id,S.me);
  await net();show("lobby");renderLobby();send({type:"request_state"});
  setTimeout(()=>{if(!S.room?.host)toast("Không tìm thấy phòng hoặc host chưa phản hồi.")},2500);
 }catch(e){toast(e.message||"Không vào được phòng")}
}
function ready(){S.me.ready=!S.me.ready;send({type:"ready",id:S.id,ready:S.me.ready});if(S.host)broadcastState();renderLobby()}
function assignRoles(){
 let a=[...S.players.values()].sort(()=>Math.random()-.5);a.forEach(p=>p.role="CREW");
 const n=Math.min(S.settings.killers||1,Math.max(1,Math.floor(a.length/3)));for(let i=0;i<n;i++)a[i].role="KILLER";
}
function start(){
 if(!S.host)return toast("Chỉ Host mới bắt đầu.");
 if(S.players.size<3)return toast("Cần ít nhất 3 người.");
 if([...S.players.values()].some(p=>!p.is_bot&&!p.ready))return toast("Có người chưa sẵn sàng.");
 assignRoles();S.round=1;S.phase="playing";
 for(const p of S.players.values()){p.alive=true;p.ghost=false;p.deadBody=false;p.task=0;p.kills=0;p.lastKill=0;p.x=420+Math.random()*80;p.y=320+Math.random()*60}
 const roles={};for(const p of S.players.values())roles[p.id]=p.role;
 broadcastState();send({type:"start",data:state(),roles});gameStart();
}
async function kill(){
 if(S.me.role!=="KILLER")return toast("Bạn không phải Kẻ Sát Nhân.");
 if(Date.now()-S.me.lastKill<18000)return toast("Kill đang hồi.");
 let p=[...S.players.values()].filter(x=>x.id!==S.id&&x.alive).sort((a,b)=>dist(S.me,a)-dist(S.me,b))[0];
 if(!p||dist(S.me,p)>75)return toast("Không có mục tiêu trong tầm.");
 p.alive=false;p.ghost=true;p.deadBody=true;p.deadX=p.x;p.deadY=p.y;S.me.lastKill=Date.now();S.me.kills++;
 send({type:"kill",id:p.id,x:p.x,y:p.y});if(S.host)broadcastState();checkWin();
}
function task(){
 if(!S.me?.alive||S.me.role==="KILLER")return;
 let seq=[0,1,2,3].sort(()=>Math.random()-.5),i=0;$("taskBtns").innerHTML="";$("taskModal").classList.add("show");
 [0,1,2,3].forEach(n=>{let b=document.createElement("button");b.className="btn";b.textContent=["🔴","🔵","🟢","🟡"][n];b.onclick=()=>{if(n!==seq[i++]){toast("Sai chuỗi.");i=0;return}if(i===4){S.me.task=Math.min(7,S.me.task+1);send({type:"task",id:S.id,task:S.me.task});if(S.host)broadcastState();toast("Task hoàn thành");i=0;checkWin()}};$("taskBtns").appendChild(b)})
}
function openMeeting(reason){S.phase="meeting";S.meeting={end:Date.now()+30000,votes:new Map()};$("meetingReason").textContent=reason;$("meetingModal").classList.add("show");renderVotes()}
function meeting(reason="Cuộc họp khẩn cấp"){if(S.meeting)return toast("Đang họp.");openMeeting(reason);send({type:"meeting",reason})}
function renderVotes(){$("votes").innerHTML="";for(const p of S.players.values())if(p.alive){let d=document.createElement("div");d.className="vote";d.innerHTML=`<span>🦆 ${safe(p.name)}</span><button class="btn">VOTE</button>`;d.querySelector("button").onclick=()=>vote(p.id);$("votes").appendChild(d)}}
function vote(id){if(!S.meeting||S.meeting.votes.has(S.id))return toast("Bạn đã vote.");S.meeting.votes.set(S.id,id);send({type:"vote",voter:S.id,target:id});applyVote(S.id,id)}
function applyVote(voter,target){if(!S.meeting)S.meeting={end:Date.now()+30000,votes:new Map()};S.meeting.votes.set(voter,target);if(S.meeting.votes.size>=[...S.players.values()].filter(p=>p.alive).length)resolveVotes()}
function resolveVotes(){
 let c={};for(const x of S.meeting.votes.values())c[x]=(c[x]||0)+1;let m=Math.max(...Object.values(c),0),top=Object.keys(c).filter(k=>c[k]===m);
 if(top.length===1&&top[0]!=="skip"){let p=S.players.get(top[0]);if(p){p.alive=false;p.ghost=true;p.deadBody=false}}
 $("meetingModal").classList.remove("show");S.meeting=null;S.phase="playing";if(S.host)broadcastState();checkWin()
}
function report(){let p=[...S.players.values()].find(x=>x.deadBody&&dist(S.me,x)<80);if(!p)return toast("Không có thi thể gần.");meeting("Báo cáo thi thể")}
function checkWin(){
 let k=[...S.players.values()].filter(p=>p.alive&&p.role==="KILLER"),c=[...S.players.values()].filter(p=>p.alive&&p.role!=="KILLER"),t=[...S.players.values()].filter(p=>p.role!=="KILLER").reduce((a,p)=>a+(p.task||0),0),max=Math.max(1,[...S.players.values()].filter(p=>p.role!=="KILLER").length*7);
 if(!k.length)return result("NGƯỜI THƯỜNG THẮNG","Tất cả Kẻ Sát Nhân đã bị loại.");
 if(t>=max)return result("NGƯỜI THƯỜNG THẮNG","Tất cả nhiệm vụ đã hoàn thành.");
 if(k.length>=c.length)return result("KẺ SÁT NHÂN THẮNG","Kẻ Sát Nhân đã chiếm ưu thế.");
}
function result(title,desc){$("resultTitle").textContent=title;$("resultDesc").textContent=desc;$("resultModal").classList.add("show");S.phase="result";if(S.host)send({type:"result",title,desc})}
$("tc").onclick=()=>{$("tc").classList.add("active");$("tj").classList.remove("active");$("createBox").classList.remove("hidden");$("joinBox").classList.add("hidden")};$("tj").onclick=()=>{$("tj").classList.add("active");$("tc").classList.remove("active");$("joinBox").classList.remove("hidden");$("createBox").classList.add("hidden")};
$("create").onclick=createRoom;$("join").onclick=joinRoom;$("ready").onclick=ready;$("start").onclick=start;$("leave").onclick=leave;$("roleOK").onclick=()=>$("roleModal").classList.remove("show");$("taskBtn").onclick=task;$("taskClose").onclick=()=>$("taskModal").classList.remove("show");$("killBtn").onclick=kill;$("reportBtn").onclick=report;$("meetingBtn").onclick=()=>meeting();$("skip").onclick=()=>vote("skip");$("backLobby").onclick=()=>{location.reload()};$("nextRound").onclick=()=>{if(!S.host)return toast("Chỉ Host.");location.reload()};
setInterval(async()=>{if(S.phase==="meeting"&&S.meeting){let n=Math.max(0,Math.ceil((S.meeting.end-Date.now())/1000));$("meetingTimer").textContent=n;if(n===0){$("meetingModal").classList.remove("show");await actRefresh()}}},500);
setInterval(()=>{if(S.phase==="lobby")sync()},2500);
</script>
</body></html>
