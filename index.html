<!doctype html>
<html lang="vi">
<head>

<style>
:root{
 --bg:#050812;
 --panel:#0b1220ee;
 --panel2:#101a2b;
 --line:#263751;
 --cyan:#65ddff;
 --green:#61e5a4;
 --red:#ff5f7e;

 --text:#eef6ff;
 --muted:#8493aa;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Inter,sans-serif
}

button,input,select,textarea{
 font:inherit
}

button{
 cursor:pointer;
 border:0
}

.hidden{
 display:none!important
}

.screen{
 position:absolute;
 inset:0;
 display:none
}

.screen.active{
 display:flex
}

/* HOME */

#home{
 align-items:center;
 justify-content:center;
 padding:15px;
 background:
 radial-gradient(circle at 50% 5%,#173657,#060913 55%,#03050a)
}

.card{
 width:min(950px,100%);
 max-height:95vh;
 overflow:auto;
 padding:24px;

.logo{

}

.sub{

}

.tabs{

 gap:8px;

}

.tab{

 padding:13px;

}

.tab.active{

}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:11px
}

.field{

 flex-direction:column;
 gap:6px
}

.full{
 grid-column:1/-1
}

label{

 color:var(--muted)

input,select,textarea{

input:focus,
select:focus,

.btn{

.primary{

.hbox{

.tasks{

.bar{

.fill{

.actions{

.stick{

}

/* MODAL */

.modal{
 position:absolute;
 inset:0;
 z-index:30;
 display:none;
 align-items:center;

 padding:15px;

.modal.show{

.modalbox{

.vote button{

#toast{

 left:50%;
 bottom:22px;
 transform:translate(-50%,25px);
 opacity:0;
 padding:10px 15px;
 background:#101a29f5;
 border:1px solid #344b69;
 border-radius:11px;
 transition:.2s;
 pointer-events:none;
 white-space:nowrap

#toast.show{

.status{
 display:inline-flex;
 align-items:center;
 gap:5px;
 font-size:11px;
 color:var(--muted)
}

.dot{
 width:8px;
 height:8px;
 border-radius:50%;
 background:#777
}

.dot.on{
 background:var(--green);
 box-shadow:0 0 10px var(--green)
}

@media(max-width:720px){
 .grid{
  grid-template-columns:1fr

  grid-template-columns:1fr

  display:none
 }

 .actions{
  width:205px
 }

 .action{
  width:59px
 }

 .code{
  font-size:30px
 }
}
</style>

<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_CONFIG = {
 url:"https://iegmxjyuuaglzpcqyyth.supabase.co",
 key:"sb_publishable_nWaQYAQ5u88dWlc8pe3_Ig_wuRm0C2J"
};

const SB =
 window.supabase?.createClient(
  SUPABASE_CONFIG.url,
  SUPABASE_CONFIG.key
 );


/* =========================================================
   STATE
========================================================= */

const S = {

 id:null,
 name:"",
 room:null,

 host:false,

 phase:"home",

 round:1,

 role:null,

 players:new Map(),

 channel:null,

 online:false,

 settings:{},

 meeting:null,

 keys:{},

 joy:{x:0,y:0},

 last:performance.now(),

 lastMove:0,

 connectedAt:0

};


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function toast(text){

 $("toast").textContent = text;

 $("toast").classList.add("show");

 clearTimeout(toast.timer);

 toast.timer=setTimeout(()=>{
  $("toast").classList.remove("show");
 },2200);

}

function show(id){

 document.querySelectorAll(".screen")
 .forEach(x=>{
  x.classList.toggle("active",x.id===id);
 });

}

function safe(text){

 return String(text||"")
 .trim()
 .replace(/[<>]/g,"")
 .slice(0,16);

}

function makeId(){

 if(crypto?.randomUUID)
  return crypto.randomUUID();

 return Math.random().toString(36).slice(2)+Date.now();

}

function makeCode(){

 return Math.random()
 .toString(36)
 .slice(2,8)
 .toUpperCase();

}

function distance(a,b){

 return Math.hypot(
  a.x-b.x,
  a.y-b.y
 );

}


/* =========================================================
   AUTH / SUPABASE
========================================================= */

function init(){

 if(!SB){

  toast("Không tải được Supabase.");

  return false;

 }

 if(!S.id)
  S.id=makeId();

 return true;

}


/* =========================================================
   NETWORK
========================================================= */

async function connectChannel(){

 if(!SB)
  throw Error("Supabase chưa tải.");

 if(!S.room?.code)
  throw Error("Chưa có mã phòng.");

 try{
  if(S.channel)
   await S.channel.unsubscribe();
 }catch{}

 const channelName =
  "deceiver_v43_"+S.room.code;

 S.channel =
  SB.channel(
   channelName,
   {
    config:{
     broadcast:{
      self:false
     }
    }
   }
  );

 S.channel.on(
  "broadcast",
  {
   event:"msg"
  },
  ({payload})=>{
   receive(payload);
  }
 );

 await new Promise((resolve,reject)=>{

  let done=false;

  S.channel.subscribe(status=>{

   if(status==="SUBSCRIBED"){

    done=true;

    S.online=true;

    setOnline(true);

    resolve();

   }

   if(
    !done &&
    (
     status==="CHANNEL_ERROR" ||
     status==="TIMED_OUT"
    )
   ){

    done=true;

    reject(
     Error("Supabase Realtime không kết nối được.")
    );

   }

  });

 });

}

function send(data){

 if(!S.channel)
  return;

 S.channel.send({

  type:"broadcast",

  event:"msg",

  payload:{
   ...data,
   sender:S.id
  }

 });

}

function setOnline(value){

 $("onlineDot").classList.toggle("on",value);

 $("onlineText").textContent =
  value ? "Realtime ONLINE" : "Offline";

}


/* =========================================================
   PUBLIC STATE
========================================================= */

function publicPlayer(p){

 return {

  id:p.id,

  name:p.name,

  is_bot:!!p.is_bot,

  is_host:!!p.is_host,

  ready:!!p.ready,

  alive:p.alive!==false,

  ghost:!!p.ghost,

  x:Number(p.x)||450,

  y:Number(p.y)||350,

  task:Number(p.task)||0,

  kills:Number(p.kills)||0,

  deadBody:!!p.deadBody,

  deadX:Number(p.deadX)||0,

  deadY:Number(p.deadY)||0

 };

}

function getPublicState(){

 return {

  room:{
   code:S.room.code,
   host:S.room.host,
   status:S.room.status
  },

  settings:S.settings,

  round:S.round,

  phase:S.phase,

  players:[

   ...S.players.values()

  ].map(publicPlayer)

 };

}

function sendState(){

 if(!S.host)
  return;

 send({

  type:"state",

  data:getPublicState()

 });

}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom(){

 try{

  if(!init())
   return;

  const name=safe(
   $("nameCreate").value
  );

  if(!name){

   toast("Nhập tên người chơi.");

   return;

  }

  const maxPlayers=
   Number($("maxP").value);

  const killers=
   Number($("killers").value);

  const bots=
   Number($("bots").value);

  if(bots+1>maxPlayers){

   toast("Số bot vượt quá số người.");

   return;

  }

  if(killers>=maxPlayers-bots){

   toast("Số Kẻ Sát Nhân quá nhiều.");

   return;

  }

  S.name=name;

  S.room={

   code:makeCode(),

   host:S.id,

   status:"lobby",

   password:$("passCreate").value||""

  };

  S.host=true;

  S.round=1;

  S.phase="lobby";

  S.settings={

   maxPlayers,

   killers,

   bots,

   difficulty:$("difficulty").value,

   rounds:Number($("rounds").value),

   hideDead:$("hideDead").value==="true"

  };

  S.players.clear();

  S.me={

   id:S.id,

   name,

   is_bot:false,

   is_host:true,

   ready:true,

   alive:true,

   ghost:false,

   x:450,

   y:350,

   task:0,

   kills:0,

   deadBody:false,

   deadX:0,

   deadY:0

  };

  S.players.set(S.id,S.me);

  for(let i=0;i<bots;i++){

   const bot={

    id:makeId(),

    name:"BOT_"+(i+1),

    is_bot:true,

    is_host:false,

    ready:true,

    alive:true,

    ghost:false,

    x:400+Math.random()*120,

    y:300+Math.random()*100,

    task:0,

    kills:0,

    deadBody:false,

    deadX:0,

    deadY:0

   };

   S.players.set(bot.id,bot);

  }

  await connectChannel();

  show("lobby");

  renderLobby();

  sendState();

  toast("Đã tạo phòng "+S.room.code);

 }catch(e){

  console.error(e);

  toast(
   e?.message ||
   "Không tạo được phòng."
  );

 }

}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom(){

 try{

  if(!init())
   return;

  const name=safe(
   $("nameJoin").value
  );

  const roomCode=
   $("codeJoin").value
   .trim()
   .toUpperCase();

  const password=
   $("passJoin").value||"";

  if(!name){

   toast("Nhập tên.");

   return;

  }

  if(!/^[A-Z0-9]{6}$/.test(roomCode)){

   toast("Mã phòng phải có 6 ký tự.");

   return;

  }

  S.name=name;

  S.room={

   code:roomCode,

   host:null,

   status:"unknown",

   password:""

  };

  S.host=false;

  S.phase="lobby";

  S.players.clear();

  S.me={

   id:S.id,

   name,

   is_bot:false,

   is_host:false,

   ready:false,

   alive:true,

   ghost:false,

   x:450,

   y:350,

   task:0,

   kills:0,

   deadBody:false,

   deadX:0,

   deadY:0

  };

  S.players.set(S.id,S.me);

  await connectChannel();

  show("lobby");

  renderLobby();

  send({

   type:"hello",

   player:publicPlayer(S.me),

   password

  });

  setTimeout(()=>{

   if(!S.room?.host){

    toast(
     "Không tìm thấy phòng hoặc Host chưa phản hồi."
    );

   }

  },3000);

 }catch(e){

  console.error(e);

  toast(
   e?.message ||
   "Không vào được phòng."
  );

 }

}


/* =========================================================
   NETWORK RECEIVE
========================================================= */

function receive(p){

 if(!p || p.sender===S.id)
  return;


 /* HOST: người mới xin vào */

 if(
  p.type==="hello" &&
  S.host
 ){

  if(S.phase!=="lobby"){

   send({

    type:"joinDenied",

    target:p.sender,

    reason:"Phòng đã bắt đầu."

   });

   return;

  }

  const current=
   [...S.players.values()]
   .filter(x=>!x.is_bot)
   .length;

  const total=
   S.players.size;

  if(total>=S.settings.maxPlayers){

   send({

    type:"joinDenied",

    target:p.sender,

    reason:"Phòng đã đầy."

   });

   return;

  }

  if(
   S.room.password &&
   p.password!==S.room.password
  ){

   send({

    type:"joinDenied",

    target:p.sender,

    reason:"Sai mật khẩu."

   });

   return;

  }

  if(S.players.has(p.player.id))
   return;

  const newPlayer={

   ...p.player,

   is_host:false,

   ready:false

  };

  S.players.set(
   newPlayer.id,
   newPlayer
  );

  send({

   type:"joinAccepted",

   target:newPlayer.id

  });

  sendState();

  renderLobby();

  return;

 }


 /* JOIN ACCEPTED */

 if(
  p.type==="joinAccepted" &&
  p.target===S.id
 ){

  if(!S.room)
   return;

  toast("Đã vào phòng.");

  return;

 }


 /* JOIN DENIED */

 if(
  p.type==="joinDenied" &&
  p.target===S.id
 ){

  toast(
   p.reason||
   "Không thể vào phòng."
  );

  try{
   awaitLeave(false);
  }catch{}

  return;

 }


 /* HOST STATE */

 if(p.type==="state"){

  applyPublicState(p.data);

  if(S.phase==="lobby")
   renderLobby();

  if(S.phase==="playing")
   render();

  return;

 }


 /* READY */

 if(p.type==="ready"){

  const q=
   S.players.get(p.id);

  if(q){

   q.ready=!!p.ready;

   renderLobby();

  }

  if(S.host)
   sendState();

  return;

 }


 /* START */

 if(
  p.type==="start" &&
  p.data
 ){

  applyPublicState(p.data);

  S.phase="playing";

  if(p.targetRoles?.[S.id])
   S.role=p.targetRoles[S.id];

  show("game");

  revealRole();

  return;

 }


 /* ROLE */

 if(
  p.type==="role" &&
  p.target===S.id
 ){

  S.role=p.role;

  revealRole();

  return;

 }


 /* MOVE */

 if(p.type==="move"){

  const q=
   S.players.get(p.id);

  if(q){

   q.x=p.x;

   q.y=p.y;

  }

  return;

 }


 /* KILL */

 if(p.type==="kill"){

  const q=
   S.players.get(p.target);

  if(q){

   q.alive=false;

   q.ghost=true;

   q.deadBody=true;

   q.deadX=p.x;

   q.deadY=p.y;

  }

  if(p.killer===S.id){

   S.me.kills++;

  }

  checkWin();

  return;

 }


 /* TASK */

 if(p.type==="task"){

  const q=
   S.players.get(p.id);

  if(q)
   q.task=p.task;

  updateTaskBar();

  checkWin();

  return;

 }


 /* MEETING */

 if(p.type==="meeting"){

  openMeeting(
   p.reason||"Cuộc họp"
  );

  return;

 }


 /* VOTE */

 if(p.type==="vote"){

  if(!S.meeting)
   openMeeting("Cuộc họp");

  S.meeting.votes.set(
   p.voter,
   p.target
  );

  if(S.host)
   checkVotes();

  return;

 }


 /* RESULT */

 if(p.type==="result"){

  showResult(
   p.title,
   p.desc
  );

  return;

 }


 /* LEAVE */

 if(p.type==="leave"){

  S.players.delete(p.id);

  if(S.host)
   sendState();

  renderLobby();

  }

}


/* =========================================================
   APPLY STATE
========================================================= */

function applyPublicState(data){

 if(!data)
  return;

 if(data.room){

  S.room={
   ...S.room,
   ...data.room
  };

 }

 if(data.settings)
  S.settings=data.settings;

 if(data.round)
  S.round=data.round;

 if(data.phase)
  S.phase=data.phase;

 if(Array.isArray(data.players)){

  const old=
   new Map(S.players);

  S.players.clear();

  for(const p of data.players){

   const previous=
    old.get(p.id)||{};

   S.players.set(
    p.id,
    {
     ...previous,
     ...p
    }
   );

  }

 }

 const me=
  S.players.get(S.id);

 if(me){

  S.me=me;

  S.me.role=S.role;

 }

 S.host=
  S.room?.host===S.id;

}

  roles[p.id]=p.role;

 /* Không đưa roles vào public state */

 send({

  type:"start",

  data:publicData,

  targetRoles:roles

 });

 /* Host tự đặt role */

 S.role=
  roles[S.id];

 S.me.role=S.role;

 show("game");

 revealRole();

========================================================= */

function assignRoles(){

  [...S.players.values()];

 all.forEach(

 );

 const shuffled=
  [...all]
  .sort(()=>Math.random()-.5);

 const maxKillers=
  Math.min(
   Number(S.settings.killers)||1,
   Math.max(
    1,
    Math.floor(all.length/4)
   )
  );

 for(
  let i=0;
  i<maxKillers;
  i++
 ){

  shuffled[i].role="KILLER";

 }

}

/* =========================================================
   MOVEMENT
========================================================= */

function move(dt){

 if(!S.me?.alive)
  return;

 let x=0;
 let y=0;

 if(
  S.keys.w ||
  S.keys.ArrowUp
 ) y--;

 if(
  S.keys.s ||
  S.keys.ArrowDown
 ) y++;

 if(
  S.keys.a ||
  S.keys.ArrowLeft
 ) x--;

 if(
  S.keys.d ||
  S.keys.ArrowRight
 ) x++;

 x+=S.joy.x;
 y+=S.joy.y;

 const len=
  Math.hypot(x,y);

 if(len>.1){

  x/=len;
  y/=len;

  S.me.x+=x*145*dt;
  S.me.y+=y*145*dt;

  S.me.x=
   Math.max(
    45,
    Math.min(
     1075,
     S.me.x
    )
   );

  S.me.y=
   Math.max(
    45,
    Math.min(
     625,
     S.me.y
    )
   );

  const now=Date.now();

  if(now-S.lastMove>80){

   S.lastMove=now;

   send({

    type:"move",

    id:S.id,

    x:S.me.x,

    y:S.me.y

   });

  }

 }

}


/* =========================================================
   MAP
========================================================= */

const MAP={

 walls:[
  [0,0,1120,30],
  [0,640,1120,30],
  [0,0,30,670],
  [1090,0,30,670]
 ],

 rooms:[
  ["CENTRAL",280,220,300,210],
  ["REACTOR",620,100,270,210],
  ["SECURITY",620,360,220,170],
  ["STORAGE",70,100,210,190],
  ["WORKSHOP",70,350,210,190],
  ["GARDEN",330,470,260,160]
 ]

};


/* =========================================================
   CANVAS
========================================================= */

const canvas=$("canvas");

const ctx=
 canvas.getContext("2d");

function resize(){

 canvas.width=
  innerWidth*devicePixelRatio;

 canvas.height=
  innerHeight*devicePixelRatio;

 ctx.setTransform(
  devicePixelRatio,
  0,
  0,
  devicePixelRatio,
  0,
  0
 );

}

addEventListener(
 "resize",
 resize
);

resize();


function render(){

 const w=innerWidth;
 const h=innerHeight;

 ctx.clearRect(
  0,0,w,h
 );

 ctx.fillStyle="#071019";

 ctx.fillRect(
  0,0,w,h
 );

 const mx=
  S.me?.x||450;

 const my=
  S.me?.y||350;

 const ox=
  mx-w/2;

 const oy=
  my-h/2;

 ctx.save();

 ctx.translate(
  -ox,
  -oy
 );

 /* background */

 ctx.fillStyle="#101a28";

 ctx.fillRect(
  0,0,1120,670
 );

 /* rooms */

 for(const r of MAP.rooms){

  ctx.fillStyle="#111e2d";

  ctx.fillRect(
   r[1],
   r[2],
   r[3],
   r[4]
  );

  ctx.strokeStyle="#29415b";

  ctx.strokeRect(
   r[1],
   r[2],
   r[3],
   r[4]
  );

  ctx.fillStyle="#60738d";

  ctx.font=
   "bold 12px Arial";

  ctx.textAlign="left";

  ctx.fillText(
   r[0],
   r[1]+10,
   r[2]+18
  );

 }

 /* walls */

 ctx.fillStyle="#25364b";

 for(const a of MAP.walls)
  ctx.fillRect(...a);


 /* dead bodies */

 for(const p of S.players.values()){

  if(
   !p.deadBody ||
   p.alive
  ) continue;

  if(
   S.settings.hideDead &&
   !S.host &&
   p.id!==S.id
  ){

   /* vẫn cho thấy dấu nhỏ */

  }

  ctx.fillStyle="#ff5f7e";

  ctx.beginPath();

  ctx.arc(
   p.deadX||p.x,
   p.deadY||p.y,
   9,
   0,
   Math.PI*2
  );

  ctx.fill();

 }


 /* players */

 for(const p of S.players.values()){

  if(!p.alive)
   continue;

  ctx.fillStyle=
   p.id===S.id
    ?"#65ddff"
    :"#ffd45d";

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   18,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.font=
   "bold 11px Arial";

  ctx.textAlign="center";

  ctx.fillText(
   p.name,
   p.x,
   p.y-27
  );

 }

 ctx.restore();

}


/* =========================================================
   TASK
========================================================= */

function openTask(){

 if(!S.me?.alive)
  return;

 if(S.role==="KILLER"){

  toast("Kẻ Sát Nhân không làm task.");

  return;

 }

 let sequence=
  [0,1,2,3]
  .sort(()=>Math.random()-.5);

 let index=0;

 $("taskBtns").innerHTML="";

 $("taskModal")
  .classList.add("show");

 [0,1,2,3].forEach(n=>{

  const b=
   document.createElement("button");

  b.className="btn";

  b.textContent=
   ["🔴","🔵","🟢","🟡"][n];

  b.onclick=()=>{

   if(n!==sequence[index]){

    toast("Sai chuỗi!");

    index=0;

    return;

   }

   index++;

   if(index===4){

    S.me.task=
     Math.min(
      7,
      (S.me.task||0)+1
     );

    send({

     type:"task",

     id:S.id,

     task:S.me.task

    });

    if(S.host)
     sendState();

    updateTaskBar();

    toast("TASK hoàn thành!");

    index=0;

    checkWin();

   }

  };

  $("taskBtns")
   .appendChild(b);

 });

}

function updateTaskBar(){

 const value=
  Math.min(
   100,
   ((S.me?.task||0)/7)*100
  );

 $("taskFill").style.width=
  value+"%";

}


/* =========================================================
   KILL
========================================================= */

function kill(){

 if(S.role!=="KILLER"){

  toast("Bạn không phải Kẻ Sát Nhân.");

  return;

 }

 if(!S.me.alive)
  return;

 if(
  S.me.lastKill &&
  Date.now()-S.me.lastKill<18000
 ){

  const left=
   Math.ceil(
    (18000-
     (Date.now()-S.me.lastKill))/1000
   );

  toast(
   "Kill hồi sau "+left+"s"
  );

  return;

 }

 const targets=
  [...S.players.values()]
  .filter(p=>
   p.id!==S.id &&
   p.alive
  )
  .sort(
   (a,b)=>
    distance(S.me,a)-
    distance(S.me,b)
  );

 const target=targets[0];

 if(
  !target ||
  distance(S.me,target)>75
 ){

  toast(
   "Không có mục tiêu trong tầm."
  );

  return;

 }

 target.alive=false;
 target.ghost=true;
 target.deadBody=true;
 target.deadX=target.x;
 target.deadY=target.y;

 S.me.lastKill=Date.now();
 S.me.kills++;

 send({

  type:"kill",

  target:target.id,

  killer:S.id,

  x:target.x,

  y:target.y

 });

 if(S.host)
  sendState();

 checkWin();

}


/* =========================================================
   MEETING
========================================================= */

function meeting(
 reason="Cuộc họp khẩn cấp"
){

 if(!S.me?.alive)
  return;

 if(S.meeting){

  toast("Đang có cuộc họp.");

  return;

 }

 openMeeting(reason);

 send({

  type:"meeting",

  reason

 });

}

function openMeeting(reason){

 S.phase="meeting";

 S.meeting={

  end:Date.now()+30000,

  votes:new Map()

 };

 $("meetingReason")
  .textContent=reason;

 $("meetingModal")
  .classList.add("show");

 renderVotes();

}

function renderVotes(){

 $("votes").innerHTML="";

 for(const p of S.players.values()){

  if(!p.alive)
   continue;

  const row=
   document.createElement("div");

  row.className="vote";

  row.innerHTML=`

   <span>
    🦆 ${escapeHTML(p.name)}
   </span>

   <button class="btn">
    VOTE
   </button>

  `;

  row.querySelector("button")
   .onclick=()=>vote(p.id);

  $("votes").appendChild(row);

 }

}

function vote(target){

 if(!S.meeting)
  return;

 if(S.meeting.votes.has(S.id)){

  toast("Bạn đã vote.");

  return;

 }

 S.meeting.votes.set(
  S.id,
  target
 );

 send({

  type:"vote",

  voter:S.id,

  target

 });

 if(S.host)
  checkVotes();

}

function checkVotes(){

 if(!S.meeting)
  return;

 const alive=
  [...S.players.values()]
  .filter(p=>p.alive);

 if(
  S.meeting.votes.size<
  alive.length
 )
  return;

 resolveVotes();

}

function resolveVotes(){

 if(!S.host)
  return;

 const count={};

 for(
  const target of
  S.meeting.votes.values()
 ){

  count[target]=
   (count[target]||0)+1;

 }

 let highest=0;

 for(const n of Object.values(count))
  highest=Math.max(highest,n);

 const winners=
  Object.keys(count)
  .filter(
   id=>count[id]===highest
  );

 let eliminated=null;

 if(
  winners.length===1 &&
  winners[0]!=="skip"
 ){

  eliminated=
   S.players.get(winners[0]);

  if(eliminated){

   eliminated.alive=false;
   eliminated.ghost=true;

  }

 }

 $("meetingModal")
  .classList.remove("show");

 S.meeting=null;

 S.phase="playing";

 sendState();

 checkWin();

}

   REPORT
========================================================= */

function report(){

 const body=
  [...S.players.values()]
  .find(
   p=>
    p.deadBody &&

  );

 if(!body){

  toast(
   "Không có thi thể gần."
  );

  return;

 }

 meeting("Báo cáo thi thể");

}


/* =========================================================
   WIN
========================================================= */

function checkWin(){

 const killers=
  [...S.players.values()]
  .filter(
   p=>
    p.alive &&
    p.role==="KILLER"
  );

 const crew=
  [...S.players.values()]
  .filter(
   p=>
    p.alive &&
    p.role!=="KILLER"
  );

 const allCrew=
  [...S.players.values()]
  .filter(
   p=>p.role!=="KILLER"
  );

 const tasks=
  allCrew.reduce(
   (sum,p)=>
    sum+(p.task||0),
   0
  );

 const maxTasks=
  Math.max(
   1,
   allCrew.length*7
  );


 if(killers.length===0){

  finishGame(
   "NGƯỜI THƯỜNG THẮNG",
   "Tất cả Kẻ Sát Nhân đã bị loại."
  );

  return;

 }

 if(tasks>=maxTasks){

  finishGame(
   "NGƯỜI THƯỜNG THẮNG",
   "Tất cả nhiệm vụ đã hoàn thành."
  );

  return;

 }

 if(
  killers.length>=crew.length
 ){

  finishGame(
   "KẺ SÁT NHÂN THẮNG",
   "Kẻ Sát Nhân đã chiếm ưu thế."
  );

 }

}

function finishGame(
 title,
 desc
){

 if(S.phase==="result")
  return;

 S.phase="result";

 showResult(
  title,
  desc
 );

 if(S.host){

  send({

   type:"result",

   title,

   desc

  });

 }

}

function showResult(
 title,
 desc
){

 $("resultTitle")
  .textContent=title;

 $("resultDesc")
  .textContent=desc;

 $("resultModal")
  .classList.add("show");

}


/* =========================================================
   LEAVE
========================================================= */

async function awaitLeave(notify=true){

 if(notify){

  send({

   type:"leave",

   id:S.id

  });

 }

/* =========================================================
   JOYSTICK
========================================================= */

let joyPointer=null;

function joystick(e){

 const rect=
  $("joy").getBoundingClientRect();

 let dx=
  e.clientX-
  rect.left-
  rect.width/2;

 let dy=
  e.clientY-
  rect.top-
  rect.height/2;

 const max=48;

 const d=
  Math.hypot(dx,dy)||1;

 if(d>max){

  dx=dx/d*max;

  dy=dy/d*max;

 }

 $("stick").style.transform=
  `translate(
   calc(-50% + ${dx}px),
   calc(-50% + ${dy}px)
  )`;

 S.joy.x=dx/max;
 S.joy.y=dy/max;

}

$("joy").addEventListener(
 "pointerdown",
 e=>{

  joyPointer=e.pointerId;

  $("joy")
   .setPointerCapture(joyPointer);

  joystick(e);

 });

$("joy").addEventListener(
 "pointermove",
 e=>{

  if(
   e.pointerId===
   joyPointer
  )
   joystick(e);

 });

["pointerup","pointercancel"]
.forEach(event=>{

 $("joy").addEventListener(
  event,
  ()=>{

   joyPointer=null;

   S.joy.x=0;
   S.joy.y=0;

   $("stick").style.transform=
    "translate(-50%,-50%)";

  }
 );

});


/* =========================================================
   BOT AI
========================================================= */

let botTimer=0;

function updateBots(){

 if(!S.host)
  return;

 if(S.phase!=="playing")
  return;

 const bots=
  [...S.players.values()]
  .filter(
   p=>p.is_bot&&p.alive
  );

 for(const bot of bots){

  const dx=
   Math.random()*2-1;

  const dy=
   Math.random()*2-1;

  bot.x+=dx*3;
  bot.y+=dy*3;

  bot.x=
   Math.max(
    50,
    Math.min(1070,bot.x)
   );

  bot.y=
   Math.max(
    50,
    Math.min(620,bot.y)
   );

 }

 sendState();

}
