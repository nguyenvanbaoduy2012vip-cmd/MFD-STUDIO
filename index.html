<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Deceiver</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#080b12;color:#eef2ff;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding:20px}
.card{background:rgba(20,25,38,.82);border:1px solid #293249;border-radius:22px;padding:20px;box-shadow:0 18px 60px #0006;backdrop-filter:blur(18px)}
.hidden{display:none!important}.muted{color:#98a3ba}.brand{text-align:center;padding:45px 20px}.brand h1{font-size:44px;margin:10px 0}.pill{display:inline-block;padding:7px 12px;border-radius:99px;background:#151d30;color:#9fc1ff}
h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.brand h1{font-size:36px}}
label{display:block;color:#aeb8ce;font-size:13px;margin:13px 0 7px}input,select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #303a52;background:#0e1421;color:#fff;outline:none}
input:focus,select:focus{border-color:#719bff}.btn{width:100%;padding:14px;border-radius:14px;background:#e9efff;color:#101522;font-weight:800;margin-top:12px}.btn.secondary{background:#182136;color:#dce6ff}.btn.danger{background:#3a1720;color:#ffccd5}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.roomcode{font-size:28px;letter-spacing:6px;font-weight:900;text-align:center;padding:15px;background:#0b101b;border-radius:15px;margin:10px 0}
.list{display:grid;gap:8px;margin-top:12px}.player{display:flex;justify-content:space-between;padding:12px;border:1px solid #293249;border-radius:13px;background:#101624}.bot{color:#9cc0ff}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#eef2ff;color:#101522;padding:12px 18px;border-radius:99px;display:none}
.small{font-size:12px}.switch{display:flex;justify-content:space-between;align-items:center;padding:11px 0}
</style>
</head>
<body>
<div class="app">
<section id="splash" class="card brand">
 <div class="pill">MFD STUDIO</div><h1>THE DECEIVER</h1>
 <p class="muted">By MFD Studio</p><p class="small muted">Developer : BDUY<br>Admin : Tkiet , Milk</p>
</section>

<section id="home" class="card hidden">
 <h2>The Deceiver</h2><p class="muted">Online social deduction • 3–12 người</p>
 <button class="btn" onclick="show('create')">Tạo phòng</button>
 <button class="btn secondary" onclick="show('join')">Vào phòng</button>
</section>

<section id="create" class="card hidden">
 <h2>Tạo phòng</h2>
 <label>Tên của bạn</label><input id="cname" maxlength="20" placeholder="VD: BDUY">
 <label>Mật khẩu phòng (không bắt buộc)</label><input id="cpass" maxlength="30" type="password">
 <div class="grid">
  <div><label>Tối đa người chơi</label><select id="maxp"></select></div>
  <div><label>Số Imposter</label><select id="imposters"></select></div>
  <div><label>Số bot</label><select id="bots"></select></div>
  <div><label>Độ khó bot</label><select id="difficulty"><option>Easy</option><option selected>Normal</option><option>Hardcore</option></select></div>
  <div><label>Số vòng</label><select id="rounds"></select></div>
 </div>
 <div class="switch"><span>Ẩn tên người chết</span><input id="hideDead" type="checkbox" style="width:auto"></div>
 <button class="btn" onclick="createRoom()">Tạo phòng</button>
 <button class="btn secondary" onclick="show('home')">Quay lại</button>
</section>

<section id="join" class="card hidden">
 <h2>Vào phòng</h2>
 <label>Tên của bạn</label><input id="jname" maxlength="20">
 <label>Mã phòng</label><input id="jcode" maxlength="8" style="text-transform:uppercase">
 <label>Mật khẩu (nếu có)</label><input id="jpass" type="password">
 <button class="btn" onclick="joinRoom()">Vào</button>
 <button class="btn secondary" onclick="show('home')">Quay lại</button>
</section>

<section id="lobby" class="card hidden">
 <div class="row"><div><h2>Sảnh phòng</h2><span class="muted" id="roomInfo"></span></div><button class="btn secondary" onclick="copyCode()">Copy mã</button></div>
 <div class="roomcode" id="codeView">------</div>
 <div id="settings" class="muted"></div>
 <div class="list" id="players"></div>
 <button id="startBtn" class="btn" onclick="startGame()">Bắt đầu ván</button>
 <button class="btn danger" onclick="leaveRoom()">Rời phòng</button>
</section>

<section id="game" class="card hidden">
 <h2>Ván chơi</h2>
 <p id="roleText"></p>
 <p class="muted">Hệ thống chia vai trò phía máy chủ. Người chơi khác không thể đọc role của bạn từ bảng lobby.</p>
 <button class="btn danger" onclick="leaveRoom()">Thoát phòng</button>
</section>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://iegmxjyuuaglzpcqyyth.supabase.co";
const SUPABASE_KEY="sb_publishable_nWaQYAQ5u88dWlc8pe3_Ig_wuRm0C2J";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let room=null, me=null, channel=null;

const $=id=>document.getElementById(id);
function show(id){for(const s of ['home','create','join','lobby','game'])$(s).classList.add('hidden');$(id).classList.remove('hidden')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
for(let i=3;i<=12;i++)$('maxp').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
for(let i=1;i<=3;i++)$('imposters').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
for(let i=0;i<=10;i++)$('bots').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
for(let i=1;i<=20;i++)$('rounds').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
$('maxp').value=8;$('imposters').value=1;$('rounds').value=3;

function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function validName(n){return n && n.trim().length>=1 && n.trim().length<=20}
function validateImp(){let m=+$('maxp').value;let b=+$('bots').value;let i=+$('imposters').value;if(i>=m){toast('Số Imposter phải nhỏ hơn số người chơi');return false}if(b>=m){toast('Số bot phải nhỏ hơn số người chơi');return false}return true}
$('maxp').onchange=()=>{let m=+$('maxp').value;[...$('imposters').options].forEach(o=>o.disabled=+o.value>=m);if(+$('imposters').value>=m)$('imposters').value=1};

async function createRoom(){
 if(!validName($('cname').value)||!validateImp())return toast('Kiểm tra thông tin phòng');
 const max=+$('maxp').value,bots=+$('bots').value,imp=+$('imposters').value;
 if(bots+1>max)return toast('Số bot quá nhiều so với phòng');
 const r={room_code:code(),password:$('cpass').value||null,max_players:max,bot_count:bots,imposter_count:imp,difficulty:$('difficulty').value,hide_dead_names:$('hideDead').checked,rounds:+$('rounds').value,status:'lobby'};
 let {data,error}=await sb.from('rooms').insert(r).select().single();if(error)return toast(error.message);
 room=data;
 let meRow={room_id:room.id,name:$('cname').value.trim(),is_bot:false,alive:true,ready:true};
 let q=await sb.from('players').insert(meRow).select().single();if(q.error)return toast(q.error.message);me=q.data;
 await addBots();enterLobby();
}
async function addBots(){
 let rows=[];for(let i=0;i<room.bot_count;i++)rows.push({room_id:room.id,name:`Bot ${i+1}`,is_bot:true,alive:true,ready:true});
 if(rows.length)await sb.from('players').insert(rows);
}
async function joinRoom(){
 if(!validName($('jname').value)||!$('jcode').value.trim())return toast('Nhập tên và mã phòng');
 let q=await sb.from('rooms').select('*').eq('room_code',$('jcode').value.trim().toUpperCase()).maybeSingle();
 if(q.error||!q.data)return toast('Không tìm thấy phòng'); room=q.data;
 if(room.status!=='lobby')return toast('Ván đã bắt đầu');
 if(room.password!==($('jpass').value||null))return toast('Sai mật khẩu');
 let count=await sb.from('players').select('*',{count:'exact',head:true}).eq('room_id',room.id);
 if(count.count>=room.max_players)return toast('Phòng đã đầy');
 let p=await sb.from('players').insert({room_id:room.id,name:$('jname').value.trim(),is_bot:false,alive:true,ready:true}).select().single();
 if(p.error)return toast(p.error.message);me=p.data;enterLobby();
}
async function enterLobby(){
 show('lobby');$('codeView').textContent=room.room_code;
 $('roomInfo').textContent=`${room.max_players} người tối đa`;
 $('settings').innerHTML=`🕵️ ${room.imposter_count} Imposter · 🤖 ${room.bot_count} bot · ${room.difficulty} · 🔄 ${room.rounds} vòng`;
 renderPlayers();
 if(channel)sb.removeChannel(channel);
 channel=sb.channel('room-'+room.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_id=eq.'+room.id},renderPlayers)
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:'id=eq.'+room.id},async p=>{room=p.new;if(room.status==='playing')await loadMyRole();else enterLobby()})
 .subscribe();
}
async function renderPlayers(){
 let q=await sb.from('players').select('id,name,is_bot,alive,ready').eq('room_id',room.id).order('created_at');
 if(q.error)return;
 $('players').innerHTML=q.data.map(p=>`<div class="player"><span>${escapeHtml(p.name)} ${p.is_bot?'<span class="bot">🤖 BOT</span>':''}</span><span class="muted">${p.ready?'Sẵn sàng':'Chưa sẵn sàng'}</span></div>`).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function startGame(){
 if(!room)return;
 let p=await sb.from('players').select('id,is_bot').eq('room_id',room.id).order('created_at');
 if(p.error)return toast(p.error.message);
 if(p.data.length<3)return toast('Cần ít nhất 3 người');
 if(p.data.length>room.max_players)return toast('Phòng vượt giới hạn');
 // V2 gameplay must use server-side function/transaction for secret role assignment.
 let q=await sb.from('rooms').update({status:'playing'}).eq('id',room.id).eq('status','lobby');
 if(q.error)return toast(q.error.message);
}
async function loadMyRole(){
 show('game');
 // Role endpoint intentionally not exposed through public players table.
 // SQL below creates a secure RPC skeleton; until it is enabled, show pending.
 $('roleText').innerHTML='<b>Ván đã bắt đầu.</b><br><span class="muted">Role riêng sẽ được cấp bởi RPC bảo mật khi triển khai Edge Function/Auth.</span>';
}
async function leaveRoom(){
 if(channel)await sb.removeChannel(channel);
 room=null;me=null;show('home');
}
async function copyCode(){await navigator.clipboard?.writeText(room.room_code);toast('Đã copy mã phòng')}
setTimeout(()=>{ $('splash').classList.add('hidden'); show('home') },1800);
</script>
</body>
</html>
